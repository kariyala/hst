<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>HST Calculator</title>

<!-- Material Icons -->
<link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
}

body {
    font-family: "Inter", sans-serif;
    background:
        radial-gradient(circle at top, #16263b 0%, #0b1420 45%, #070d15 100%);
    color: #f2f5f8;

    min-height: 100vh;
    min-height: 100dvh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 20px;
}

/* Main Card */

.calculator {
    width: 100%;
    max-width: 430px;

    background: rgba(18, 30, 45, 0.94);

    border: 1px solid rgba(255, 255, 255, 0.07);

    border-radius: 24px;

    padding: 24px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);

    animation: cardAppear 0.5s ease-out;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(15px) scale(0.98);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

/* Header */

.header {
    text-align: center;
    margin-bottom: 28px;
}

.header h1 {
    margin: 0;

    font-size: 23px;
    font-weight: 700;

    letter-spacing: -0.5px;
}

.header p {
    margin: 7px 0 0;

    font-size: 13px;
    color: #8492a3;
}

/* Labels */

.field {
    margin-bottom: 18px;
}

label {
    display: block;

    margin-bottom: 9px;

    font-size: 13px;
    font-weight: 600;

    color: #aeb9c6;

    letter-spacing: 0.1px;
}

/* Input / Output */

.input-box,
.output-box {
    width: 100%;
    height: 62px;

    border-radius: 15px;

    display: flex;
    align-items: center;

    position: relative;

    transition:
        border-color 0.25s ease,
        box-shadow 0.25s ease,
        transform 0.2s ease;
}

.input-box {
    background: #0c1725;

    border: 1px solid #26384d;

    padding: 0 17px;
}

.input-box:focus-within {
    border-color: #4d8fd1;

    box-shadow:
        0 0 0 3px rgba(77, 143, 209, 0.10);

    transform: translateY(-1px);
}

.currency {
    font-size: 20px;
    font-weight: 600;

    color: #7f91a5;

    margin-right: 9px;
}

input {
    width: 100%;

    border: none;
    outline: none;

    background: transparent;

    color: #f5f8fb;

    font-family: inherit;

    font-size: 21px;
    font-weight: 600;

    letter-spacing: 0.2px;
}

input::placeholder {
    color: #46576b;
}

input::-webkit-outer-spin-button,
input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

input[type="number"] {
    appearance: textfield;
    -moz-appearance: textfield;
}

/* Output */

.output-box {
    background:
        linear-gradient(
            135deg,
            rgba(41, 76, 65, 0.35),
            rgba(17, 35, 33, 0.75)
        );

    border: 1px solid rgba(89, 156, 119, 0.25);

    padding: 0 18px;
}

.output-value {
    font-size: 23px;
    font-weight: 700;

    color: #a9e8bd;

    letter-spacing: 0.2px;

    transition:
        opacity 0.15s ease,
        transform 0.15s ease;
}

.output-value.updated {
    animation: valueUpdate 0.22s ease;
}

@keyframes valueUpdate {
    0% {
        opacity: 0.45;
        transform: translateY(3px);
    }

    100% {
        opacity: 1;
        transform: translateY(0);
    }
}

/* HST Badge */

.hst-badge {
    margin-left: auto;

    font-size: 11px;
    font-weight: 600;

    color: #83c79b;

    background: rgba(97, 180, 124, 0.10);

    padding: 6px 9px;

    border-radius: 8px;
}

/* Buttons */

.buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-top: 24px;
}

button {
    height: 54px;

    border: none;

    border-radius: 14px;

    font-family: inherit;

    font-size: 14px;
    font-weight: 600;

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 8px;

    cursor: pointer;

    transition:
        transform 0.16s ease,
        filter 0.2s ease,
        box-shadow 0.2s ease;
}

button:active {
    transform: scale(0.96);
}

/* Clear */

.clear-btn {
    background: rgba(214, 70, 70, 0.13);

    border: 1px solid rgba(214, 70, 70, 0.28);

    color: #ff8585;
}

.clear-btn:hover {
    background: rgba(214, 70, 70, 0.19);

    box-shadow:
        0 6px 20px rgba(214, 70, 70, 0.08);
}

/* Copy */

.copy-btn {
    background: rgba(102, 188, 126, 0.14);

    border: 1px solid rgba(102, 188, 126, 0.28);

    color: #9de4b0;
}

.copy-btn:hover {
    background: rgba(102, 188, 126, 0.20);

    box-shadow:
        0 6px 20px rgba(102, 188, 126, 0.08);
}

/* Material Icons */

.material-icons {
    font-size: 20px;
}

/* Notification */

.message {
    height: 22px;

    margin-top: 12px;

    text-align: center;

    font-size: 12px;
    font-weight: 600;

    opacity: 0;

    transform: translateY(-4px);

    transition:
        opacity 0.25s ease,
        transform 0.25s ease;

    pointer-events: none;
}

.message.show {
    opacity: 1;

    transform: translateY(0);
}

.message.copied {
    color: #91dfaa;
}

.message.cleared {
    color: #ff8585;
}

/* Small screen */

@media (max-width: 380px) {

    body {
        padding: 14px;
    }

    .calculator {
        padding: 20px;
        border-radius: 21px;
    }

    .header {
        margin-bottom: 23px;
    }

    .header h1 {
        font-size: 21px;
    }

    .input-box,
    .output-box {
        height: 58px;
    }

    input {
        font-size: 20px;
    }

    .output-value {
        font-size: 21px;
    }

    button {
        height: 51px;
    }
}

</style>
</head>

<body>

<div class="calculator">

    <div class="header">
        <h1>HST Calculator</h1>
        <p>Automatically calculate your final amount</p>
    </div>


    <!-- INPUT -->

    <div class="field">

        <label for="amount">
            Enter Amount :
        </label>

        <div class="input-box">

            <span class="currency">$</span>

            <input
                id="amount"
                type="number"
                inputmode="decimal"
                placeholder="0.00"
                step="0.01"
                autocomplete="off"
                autofocus
            >

        </div>

    </div>


    <!-- OUTPUT -->

    <div class="field">

        <label>
            Final Amount with HST :
        </label>

        <div class="output-box">

            <span class="currency">$</span>

            <span
                id="output"
                class="output-value">
                0.00
            </span>

            <span class="hst-badge">
                HST 13%
            </span>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="buttons">

        <button
            id="clearBtn"
            class="clear-btn"
            type="button">

            <span class="material-icons">
                delete_outline
            </span>

            Clear

        </button>


        <button
            id="copyBtn"
            class="copy-btn"
            type="button">

            <span class="material-icons">
                content_copy
            </span>

            Copy

        </button>

    </div>


    <!-- MESSAGE -->

    <div
        id="message"
        class="message">
    </div>

</div>


<script>

const amountInput = document.getElementById("amount");
const output = document.getElementById("output");

const clearBtn = document.getElementById("clearBtn");
const copyBtn = document.getElementById("copyBtn");

const message = document.getElementById("message");

let messageTimer;


/* --------------------------------
   Calculate HST
-------------------------------- */

function calculateHST() {

    const rawValue = amountInput.value.trim();

    if (rawValue === "") {

        output.textContent = "0.00";

        return;
    }

    const amount = parseFloat(rawValue);

    if (isNaN(amount)) {

        output.textContent = "0.00";

        return;
    }

    const finalAmount = amount * 1.13;

    output.textContent = finalAmount.toFixed(2);


    /* Small update animation */

    output.classList.remove("updated");

    void output.offsetWidth;

    output.classList.add("updated");
}


/* --------------------------------
   Show Message
-------------------------------- */

function showMessage(text, type) {

    clearTimeout(messageTimer);

    message.textContent = text;

    message.className = "message " + type + " show";


    messageTimer = setTimeout(() => {

        message.classList.remove("show");

    }, 1000);
}


/* --------------------------------
   Input Listener
-------------------------------- */

amountInput.addEventListener("input", calculateHST);


/* --------------------------------
   Clear
-------------------------------- */

clearBtn.addEventListener("click", () => {

    amountInput.value = "";

    output.textContent = "0.00";

    amountInput.focus();

    showMessage("Cleared", "cleared");

});


/* --------------------------------
   Copy
-------------------------------- */

copyBtn.addEventListener("click", async () => {

    const value = output.textContent;

    /*
       Don't copy the default 0.00
       when there is no input.
    */

    if (
        amountInput.value.trim() === "" ||
        value === "0.00"
    ) {

        amountInput.focus();

        return;
    }


    try {

        await navigator.clipboard.writeText("$" + value);

        showMessage("Copied", "copied");

    }

    catch (error) {

        /*
           Fallback for browsers where
           Clipboard API is unavailable.
        */

        const temp = document.createElement("textarea");

        temp.value = "$" + value;

        temp.style.position = "fixed";
        temp.style.opacity = "0";

        document.body.appendChild(temp);

        temp.select();

        document.execCommand("copy");

        document.body.removeChild(temp);

        showMessage("Copied", "copied");

    }

});


/* --------------------------------
   Prevent accidental form-like
   behaviour on Enter
-------------------------------- */

amountInput.addEventListener("keydown", (event) => {

    if (event.key === "Enter") {

        event.preventDefault();

        amountInput.blur();

    }

});

</script>

</body>
</html>
